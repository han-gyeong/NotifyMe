name: build.yml

on:
  push:
    branches:
      - master
    paths:
      - 'notification-api/**'
      - 'notification-auth/**'
      - 'notification-core/**'
      - 'notification-gateway/**'
      - 'notification-scheduler/**'
      - 'notification-sender/**'
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-2
  ECS_EXECUTION_ROLE_ARN: ${{ secrets.ECS_EXECUTION_ROLE_ARN }}
  SPRING_DATASOURCE_USERNAME_ARN: ${{ secrets.SPRING_DATASOURCE_USERNAME_ARN }}
  SPRING_DATASOURCE_PASSWORD_ARN: ${{ secrets.SPRING_DATASOURCE_PASSWORD_ARN }}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      auth: ${{ steps.filter.outputs.auth }}
      core: ${{ steps.filter.outputs.core }}
      gateway: ${{ steps.filter.outputs.gateway }}
      scheduler: ${{ steps.filter.outputs.scheduler }}
      sender: ${{ steps.filter.outputs.sender }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api: 'notification-api/**'
            auth: 'notification-auth/**'
            core: 'notification-core/**'
            gateway: 'notification-gateway/**'
            scheduler: 'notification-scheduler/**'
            sender: 'notification-sender/**'

  build-api:
    needs: detect-changes
    if: github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.api == 'true' || needs.detect-changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Gradle Test and Build
        working-directory: notification-api
        run: |
          chmod +x ./gradlew
          ./gradlew clean build

      - name: AWS Authentication
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build and push image
        uses: ./.github/actions/ecr-build-push
        with:
          service_path: notification-api
          ecr_repository: notifyme/api

  build-auth:
    needs: detect-changes
    if: github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.auth == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Gradle Test and Build
        working-directory: notification-auth
        run: |
          chmod +x ./gradlew
          ./gradlew clean build

      - name: AWS Authentication
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build and push image
        uses: ./.github/actions/ecr-build-push
        with:
          service_path: notification-auth
          ecr_repository: notifyme/auth

  build-gateway:
    needs: detect-changes
    if: github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Gradle Test and Build
        working-directory: notification-gateway
        run: |
          chmod +x ./gradlew
          ./gradlew clean build

      - name: AWS Authentication
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build and push image
        uses: ./.github/actions/ecr-build-push
        with:
          service_path: notification-gateway
          ecr_repository: notifyme/gateway

  build-scheduler:
    needs: detect-changes
    if: github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.scheduler == 'true' || needs.detect-changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Gradle Test and Build
        working-directory: notification-scheduler
        run: |
          chmod +x ./gradlew
          ./gradlew clean build

      - name: AWS Authentication
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build and push image
        uses: ./.github/actions/ecr-build-push
        with:
          service_path: notification-scheduler
          ecr_repository: notifyme/scheduler

  build-sender:
    needs: detect-changes
    if: github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.sender == 'true' || needs.detect-changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Gradle Test and Build
        working-directory: notification-sender
        run: |
          chmod +x ./gradlew
          ./gradlew clean build

      - name: AWS Authentication
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build and push image
        uses: ./.github/actions/ecr-build-push
        with:
          service_path: notification-sender
          ecr_repository: notifyme/sender

  deploy-api:
    needs: build-api
    if: needs.build-api.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: AWS Authentication
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to ECS
        uses: ./.github/actions/ecs-deploy
        with:
          service_name: notifyme-api
          task_definition_file: .github/task-definitions/api.json
          container_name: notifyme-api
          ecr_repository: notifyme/api
          cluster_name: notifyme-applications

  deploy-auth:
    needs: build-auth
    if: needs.build-auth.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: AWS Authentication
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to ECS
        uses: ./.github/actions/ecs-deploy
        with:
          service_name: notifyme-auth
          task_definition_file: .github/task-definitions/auth.json
          container_name: notifyme-auth
          ecr_repository: notifyme/auth
          cluster_name: notifyme-applications

  deploy-gateway:
    needs: build-gateway
    if: needs.build-gateway.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: AWS Authentication
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to ECS
        uses: ./.github/actions/ecs-deploy
        with:
          service_name: notifyme-gateway
          task_definition_file: .github/task-definitions/gateway.json
          container_name: notifyme-gateway
          ecr_repository: notifyme/gateway
          cluster_name: notifyme-applications

  deploy-scheduler:
    needs: build-scheduler
    if: needs.build-scheduler.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: AWS Authentication
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to ECS
        uses: ./.github/actions/ecs-deploy
        with:
          service_name: notifyme-scheduler
          task_definition_file: .github/task-definitions/scheduler.json
          container_name: notifyme-scheduler
          ecr_repository: notifyme/scheduler
          cluster_name: notifyme-applications

  deploy-sender-email:
    needs: build-sender
    if: needs.build-sender.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: AWS Authentication
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to ECS
        uses: ./.github/actions/ecs-deploy
        with:
          service_name: notifyme-sender-email
          task_definition_file: .github/task-definitions/sender-email.json
          container_name: notifyme-sender-email
          ecr_repository: notifyme/sender
          cluster_name: notifyme-applications

  deploy-sender-slack:
    needs: build-sender
    if: needs.build-sender.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: AWS Authentication
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to ECS
        uses: ./.github/actions/ecs-deploy
        with:
          service_name: notifyme-sender-slack
          task_definition_file: .github/task-definitions/sender-slack.json
          container_name: notifyme-sender-slack
          ecr_repository: notifyme/sender
          cluster_name: notifyme-applications
