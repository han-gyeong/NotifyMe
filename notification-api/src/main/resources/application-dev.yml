server:
  port: 0

spring:
  datasource:
    url: jdbc:mysql://rdb.internal:3306/notifyme
    driver-class-name: com.mysql.cj.jdbc.Driver

  kafka:
    bootstrap-servers: infra.internal:9092

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
        show_sql: false
    open-in-view: false